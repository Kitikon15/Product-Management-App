services:
  postgres-db:
    image: postgres:15-alpine
    container_name: express_postgres_container
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
    # Host port:container port
      - "${POSTGRES_PORT}:5432"
    volumes:
    # Mount the host directory to the container directory
      - pgdata:/var/postgresql/data
    healthcheck:
      test:
      # Use CMD_SHELL to run the command in a shell
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      # The time to wait between health checks
      interval: 5s
      # The time to wait before considering the container as unhealthy
      timeout: 5s
      # The number of retries before considering the container as unhealthy
      retries: 10

  backend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    environment:
      - NODE_ENV=${NODE_ENV}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    command: >-
      sh -c 'if ["$$NODE_ENV" = "development"]; then
        npm install && npm run dev;
      else
        npm install --omit-dev && npm start;
      fi'
    ports:
      - "${BACKEND_PORT}:5000"
    depends_on:
      postgres-db:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
    - VITE_API_URL=${VITE_API_URL}
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --force"
    ports:
      - "${FRONTEND_PORT}:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  backend_node_modules:
  frontend_node_modules:
